<div class="container">
  <div class="row">
    <div class="col-12 text-center">
      <h3>Gerenciar Meios de Pagamento</h3>
    </div>
  </div>
</div>

<div class="container-fluid">

  <div class="row mb-3">
    <div class="col-12">
      <button pButton label="Novo Meio de Pagamento" icon="pi pi-plus" class="p-button-primary"
        [routerLink]="['/main/editor-pagamentos', 'new']">
      </button>
    </div>
  </div>

  <p-table [value]="lista" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5,10,20]"
    [showCurrentPageReport]="true" currentPageReportTemplate="{first} a {last} de {totalRecords} registros"
    class="p-datatable-gridlines">

    <!-- Cabeçalho -->
    <ng-template pTemplate="header">
      <tr>
        <th>#</th>
        <th>Nome</th>
        <th>Percentual Retenção (%)</th>
        <th>Visível ao Usuário</th>
      </tr>
    </ng-template>

    <!-- Corpo -->
    <ng-template pTemplate="body" let-ITEM>
      <tr>
        <td [attr.data-label]="'ID'" class="text-center">
          <a class="nav-link" [routerLink]="['/main/editor-pagamentos', ITEM.numSeq]">
            {{ ITEM.numSeq }}
          </a>
        </td>
        <td [attr.data-label]="'Descrição'" >
          <a class="nav-link" [routerLink]="['/main/editor-pagamentos', ITEM.numSeq]">
            {{ ITEM.descricao }}</a>
        </td>
        <td [attr.data-label]="'Retenção'" class="text-center">{{ ITEM.retencao }}%</td>
        <td [attr.data-label]="'Visívil'" class="text-center">
          @if(ITEM.visivel == 1){
          <p-tag severity="success" value="Sim" icon="pi pi-check"></p-tag>
          } @else {
          <p-tag severity="danger" value="Não" icon="pi pi-times"></p-tag>
          }
        </td>
      </tr>
    </ng-template>

  </p-table>

</div>
