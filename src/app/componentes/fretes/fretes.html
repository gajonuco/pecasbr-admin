<div class="container">
  <div class="row text-center">
    <div class="col-12">
      <h3>Gerenciar Fretes</h3>
    </div>
  </div>
</div>

<div class="container-fluid">
  
  <div class="row mb-3">
    <div class="col-12">
      <button pButton 
              label="Novo Frete" 
              icon="pi pi-plus" 
              class="p-button-primary"
              [routerLink]="['/main/editor-frete', 'new']">
      </button>
    </div>
  </div>

  <p-table 
    [value]="lista"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5,10,20]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first} a {last} de {totalRecords} registros"
    class="p-datatable-gridlines">

    <!-- Cabeçalho -->
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Prefixo</th>
        <th>Descrição</th>
        <th>Valor</th>
        <th>Disponível</th>
      </tr>
    </ng-template>

    <!-- Corpo -->
    <ng-template pTemplate="body" let-ITEM>
      <tr>
        <td [attr.data-label]="'ID'"  class="text-center">
          <a class="nav-link" [routerLink]="['/main/editor-frete', ITEM.id]">
          {{ ITEM.id }}</a></td>
        
        <td [attr.data-label]="'Prefixo'" >
          <a class="nav-link" [routerLink]="['/main/editor-frete', ITEM.id]">
            {{ ITEM.prefixo }}
          </a>
        </td>

        <td [attr.data-label]="'Descrição'" >{{ ITEM.descricao }}</td>

        <td [attr.data-label]="'Valor'"  class="text-center">{{ ITEM.valor | currency:'BRL' }}</td>

        <td [attr.data-label]="'Disponível'" class="text-center">
          <div class="d-flex justify-content-center form-check form-switch">
            <input class="form-check-input" 
                   type="checkbox" 
                   role="switch"
                   [(ngModel)]="ITEM.disponivel"
                   (change)="disponibiliza(ITEM)">
          </div>
        </td>
      </tr>
    </ng-template>

  </p-table>

</div>
