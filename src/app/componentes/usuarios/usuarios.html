<!-- Título -->
<div class="container">
  <div class="row">
    <div class="col-12 text-center">
      <h3>Gerenciador de Usuários</h3>
    </div>
  </div>
</div>

<div class="container-fluid">

  <!-- Botão Novo -->
  <div class="row mb-3">
    <div class="col-12">
      <button pButton 
              label="Novo Usuário" 
              icon="pi pi-plus" 
              class="p-button-primary"
              [routerLink]="['/main/editor-usuario', 'new']">
      </button>
    </div>
  </div>

  <!-- Tabela estilo produtos -->
  <p-table 
    [value]="lista"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5,10,20]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first} a {last} de {totalRecords} registros"
    class="p-datatable-gridlines">

    <!-- Cabeçalho -->
    <ng-template pTemplate="header">
      <tr>
        <th class="text-center">ID</th>
        <th>Nome</th>
        <th>Username</th>
        <th>E-mail</th>
        <th class="text-center">Ativo</th>
      </tr>
    </ng-template>

    <!-- Corpo -->
    <ng-template pTemplate="body" let-u>
      <tr>

        <td [attr.data-label]="'ID'" class="text-center">{{ u.id }}</td>

        <td [attr.data-label]="'Nome'" >
          <a class="nav-link" [routerLink]="['/main/editor-usuario', u.id]">
            {{ u.nome_usuario }}
          </a>
        </td>

        <td [attr.data-label]="'Login'" >{{ u.username }}</td>

        <td [attr.data-label]="'E-mail'" >{{ u.email }}</td>

        <td [attr.data-label]="'Ativo'" class="text-center">
          <div class="d-flex justify-content-center form-check form-switch">
            <input class="form-check-input"
                   type="checkbox"
                   role="switch"
                   [(ngModel)]="u.ativo"
                   (change)="mudaStatus(u)">
          </div>
        </td>

      </tr>
    </ng-template>

  </p-table>

</div>
