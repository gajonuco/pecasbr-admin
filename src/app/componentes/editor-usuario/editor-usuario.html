<!-- Toast fixo -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive"
        aria-atomic="true" [ngClass]="{
          'bg-success': toastType === 'success',
          'bg-danger': toastType === 'error'
       }">
        <div class="d-flex">
            <div class="toast-body">
                {{ mensagemToast }}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                aria-label="Close"></button>
        </div>
    </div>
</div>


<div class="container">
    <div class="row">
        <div class="col-12 text-center">
            <h3>Editar de Usuários</h3>
        </div>
    </div>

    @if(mode == 0){
    <div class="row mb-3">
        <div class="col-12">
            <div class="alert alert-info" role="alert">
                <i class="pi pi-info-circle me-2"></i>Inserindo novo Usuário
            </div>
        </div>
    </div>
    }@else if(mode == 1) {
    <div class="row mb-3">
        <div class="col-12">
            <div class="alert alert-warning" role="alert">
                <i class="pi pi-pencil me-2"></i>Editando usuário
            </div>
        </div>
    </div>
    }


    <div class="mb-3">
        <label for="txtNome" class="form-label">Nome Completo</label>
        <input pInputText type="text" class="form-control w-100" id="txtNome" maxlength="50"
            [(ngModel)]="usuario.nome_usuario">
    </div>

    <div class="mb-3">
        <label for="txtEmail" class="form-label">E-mail</label>
        <input pInputText type="text" class="form-control w-100" id="txtEmail" maxlength="50" (keyup)="sugereUsername()"
            [(ngModel)]="usuario.email">
    </div>

    <div class="mb-3">
        <label for="txtUsername" class="form-label">Username</label>
        <input pInputText type="text" class="form-control w-100" id="txtUsername" maxlength="50"
            [(ngModel)]="usuario.username">
    </div>

    <div class="row mb-4">
        <div class="col-12 col-xs-12 col-md-6 col-lg-6 col-xl-6">
            <label for="txtSenha" class="form-label">Senha</label>
            <input pInputText type="password" class="form-control w-100" id="txtSenha" maxlength="50"
                [(ngModel)]="usuario.senha">
        </div>
        <div class="col-12 col-xs-12 col-md-6 col-lg-6 col-xl-6">
            <label for="txtReSenha" class="form-label">Confirme a Senha</label>
            <input pInputText type="password" class="form-control w-100" id="txtReSenha" maxlength="50"
                [(ngModel)]="senha" (keyup)="confereSenha()">
        </div>
    </div>

    @if(senha && usuario.senha && !senhasIguais){
    <div class="row mb-3">
        <div class="col-12 text-center">
            <p-message severity="error" text="As senhas não coincidem."></p-message>
        </div>
    </div>
    }

  <div class="row mt-4">
    <div class="col-12 col-md-6 mb-2">
      <button pButton 
              label="Atualizar Dados" 
              icon="pi pi-check"
              class="w-100"
              (click)="atualizarUsuario()">
      </button>
    </div>
    <div class="col-12 col-md-6">
      <button pButton 
              label="Voltar" 
              icon="pi pi-arrow-left"
              class="p-button-secondary w-100"
              [routerLink]="['/main/usuarios']">
      </button>
    </div>
  </div>
</div>
