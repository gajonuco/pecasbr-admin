<div class="container">
  <div class="row">
    <div class="col-12 text-center mb-4">
      <h4><i class="pi pi-gift me-2"></i>Aniversariantes</h4>
    </div>
  </div>

  <!-- Botões de meses -->
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex flex-wrap gap-2 justify-content-center">
        <button pButton
                label="Jan"
                class="p-button-outlined p-button-sm"
                (click)="aniv(1)">
        </button>
        <button pButton
                label="Fev"
                class="p-button-outlined p-button-sm"
                (click)="aniv(2)">
        </button>
        <button pButton
                label="Mar"
                class="p-button-outlined p-button-sm"
                (click)="aniv(3)">
        </button>
        <button pButton
                label="Abr"
                class="p-button-outlined p-button-sm"
                (click)="aniv(4)">
        </button>
        <button pButton
                label="Mai"
                class="p-button-outlined p-button-sm"
                (click)="aniv(5)">
        </button>
        <button pButton
                label="Jun"
                class="p-button-outlined p-button-sm"
                (click)="aniv(6)">
        </button>
        <button pButton
                label="Jul"
                class="p-button-outlined p-button-sm"
                (click)="aniv(7)">
        </button>
        <button pButton
                label="Ago"
                class="p-button-outlined p-button-sm"
                (click)="aniv(8)">
        </button>
        <button pButton
                label="Set"
                class="p-button-outlined p-button-sm"
                (click)="aniv(9)">
        </button>
        <button pButton
                label="Out"
                class="p-button-outlined p-button-sm"
                (click)="aniv(10)">
        </button>
        <button pButton
                label="Nov"
                class="p-button-outlined p-button-sm"
                (click)="aniv(11)">
        </button>
        <button pButton
                label="Dez"
                class="p-button-outlined p-button-sm"
                (click)="aniv(12)">
        </button>
      </div>
    </div>
  </div>

  <!-- Tabela de aniversariantes -->
  <p-table
    [value]="lista"
    [paginator]="false"
    [rows]="3"
    [rowsPerPageOptions]="[5,10,20]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first} a {last} de {totalRecords} registros"
    class="p-datatable-gridlines">

    <!-- Cabeçalho -->
    <ng-template pTemplate="header">
      <tr>
        <th>Nome</th>
        <th>Data</th>
        <th>WhatsApp</th>
      </tr>
    </ng-template>

    <!-- Corpo -->
    <ng-template pTemplate="body" let-ITEM>
      <tr>
        <td>
          <i class="pi pi-gift text-primary me-2"></i>
          {{ ITEM.nome }}
        </td>
        <td class="text-center">{{ ITEM.dataNasc | date:'dd/MM/yyyy' }}</td>
        <td class="text-center">{{ ITEM.telefone }}</td>
      </tr>
    </ng-template>

    <!-- Template quando não há dados -->
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="text-center text-muted">
          Nenhum aniversariante encontrado para este mês
        </td>
      </tr>
    </ng-template>

  </p-table>

</div>
