<div class="container">
  <div class="row">
    <div class="col-12 text-center mb-4">
      <h3>Editor de Categorias</h3>
    </div>
  </div>

  @if(mode == 0){
    <div class="row mb-3">
      <div class="col-12">
        <div class="alert alert-info" role="alert">
          <i class="pi pi-info-circle me-2"></i>Inserindo nova Categoria
        </div>
      </div>
    </div>
  }@else {
    <div class="row mb-3">
        <div class="col-12">
            <div class="alert alert-warning" role="alert">
                <i class="pi pi-pencil me-2"></i>Editando Categoria
            </div>
        </div>
    </div>
    }

  <div class="row">
    <div class="col-12 mb-4">
      <label for="txtNomeCategoria" class="form-label">Nome da Categoria</label>
      <input pInputText 
             type="text" 
             class="w-100" 
             id="txtNome" 
             [(ngModel)]="categoria.nome"
             placeholder="Ex: Filtros, Óleos, Pastilhas...">
    </div>
  </div>

  <div class="row">
    <div class="col-12 col-md-6 mb-2">
      <button pButton 
              label="Atualizar dados" 
              icon="pi pi-check"
              class="w-100"
              (click)="atualizarCategoria()">
      </button>
    </div>
    <div class="col-12 col-md-6">
      <button pButton 
              label="Voltar" 
              icon="pi pi-arrow-left"
              class="p-button-secondary w-100"
              [routerLink]="['/main/categorias']">
      </button>
    </div>
  </div>

</div>
